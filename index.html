<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Panther</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/panther/panther-logo.svg" />
    <link rel="apple-touch-icon" href="/panther/panther-logo.svg" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Panther — Local-First Daily Utility" />
    <meta property="og:description" content="Workout script, meal tracking, nutrition checklist, strength progression" />
    <meta property="og:image" content="/panther/panther-logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/panther/panther-logo.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; }
      button { 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.97); }
      button:hover:not(:disabled) { 
        opacity: 0.85;
        transform: translateY(-1px);
      }
      button:disabled { 
        cursor: not-allowed;
        opacity: 0.4;
      }
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
